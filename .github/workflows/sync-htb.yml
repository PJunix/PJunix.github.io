name: Sync HTB profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public HTB profile data
        run: python scripts/sync_htb.py

      - name: Commit updated profile data
        run: |
          if git diff --quiet -- data/htb-stats.json data/htb-machines.json; then
            echo "HTB data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/htb-stats.json data/htb-machines.json
          git commit -m "Update HTB profile data"
          git push
